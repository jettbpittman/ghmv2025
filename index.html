<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GHMV Class of 2025</title>
    <link rel="stylesheet" href="css/default.css">
    <link rel="stylesheet" href="css/index.css">
    <script>
        fetch('/static/header.html')
          .then(function(response) {
            return response.text();
          })
          .then(function(body) {
            document.querySelector('#header').innerHTML = body;
          });
    </script>
</head>
<body>
    <div id="header"></div>
    <table class="slate">
        <tr>
            <td id="gen-info" style="width: 65%">
                <h2><u>ARCHIVED PRODUCTIONS</u></h2>
                <table id="ticket-table">
                    <tr>
                        <th>Production</th><th>Dates</th><th></th>
                    </tr>
                    <tr>
                        <td>High Noon</td><td>December 12th and 15th, 2023</td><td><a href="productions/2023-highnoon/castlist.html">Cast list</a></td>
                    </tr>
                    <tr>
                        <td>And Then There Were None</td><td>January 24th and 25th, 2025</td><td><a href="productions/2025-attwn/castlist.html">Cast list</a></td>
                    </tr>
                    <tr>
                        <td>The Scarlet Pimpernel</td><td>May 15th and 17th, 2025</td><td><a href="productions/2025-tsp/castlist.html">Cast list</a></td>
                    </tr>
                </table>
                <br>
            </td>
            <td id="calendar" style="width: 35%">
                <h2><u>CALENDAR</u></h2>
                <table id="calendar-table">
                    <tr>
                        <td>
                            <div class="cal-header">
                                31 MAY 2025, 2:00 PM - Graduation
                            </div>
                            <div class="cal-loc">
                                Location: TBC Sanctuary<br>
                            </div>
                            <div class="cal-body">
                                <br>
                            </div>
                        </td>
                    </tr>
                </table>
                <br>
            </td>
        </tr>
    </table>
</body>
</html>
